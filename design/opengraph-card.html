<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: Archivo, system-ui, sans-serif;
    color: #fff;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(46rem 30rem at 86% 14%, rgb(230 46 200 / 0.62), transparent 62%),
      radial-gradient(34rem 24rem at 4% 108%, rgb(242 118 79 / 0.5), transparent 58%),
      radial-gradient(50rem 34rem at 55% 120%, rgb(150 43 217 / 0.55), transparent 65%),
      linear-gradient(112deg, #2439e0 0%, #3b2fdd 34%, #6b2bd9 62%, #9a29d5 84%, #c62ecf 100%);
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgb(255 255 255 / 0.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgb(255 255 255 / 0.05) 1px, transparent 1px);
    background-size: 44px 44px;
  }
  .wrap { position: relative; height: 100%; padding: 56px 72px 48px; display: flex; flex-direction: column; }
  .lockup { display: flex; align-items: center; gap: 20px; }
  .lockup img { height: 76px; width: auto; display: block; }
  .lockup span { font-weight: 800; font-size: 34px; letter-spacing: 0.07em; text-transform: uppercase; }
  h1 { margin-top: 42px; font-weight: 800; font-size: 82px; line-height: 1.02; letter-spacing: -0.025em; max-width: 1000px; }
  h1 em { font-style: normal; color: #e4c9ff; }
  p.sub { margin-top: 28px; font-weight: 700; font-size: 27px; line-height: 1.38; color: rgb(255 255 255 / 0.9); max-width: 740px; }
  .foot { margin-top: auto; padding-top: 26px; border-top: 1px solid rgb(255 255 255 / 0.28); display: flex; align-items: center; justify-content: space-between; }
  .foot .by { font-weight: 800; font-size: 20px; letter-spacing: 0.14em; text-transform: uppercase; color: rgb(255 255 255 / 0.78); }
  .pill { background: #fff; color: #1d1160; font-weight: 900; font-size: 21px; letter-spacing: 0.04em; text-transform: uppercase; padding: 16px 30px; border-radius: 999px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="wrap">
    <div class="lockup">
      <img src="hub-institute-logo-white.svg" alt="" />
      <span>Agentipedia</span>
    </div>
    <h1>The AI agent<br /><em>proof directory</em></h1>
    <p class="sub">Named companies. Named agents. Verified sources.<br />No source, no entry.</p>
    <div class="foot">
      <div class="by">By HUB Institute</div>
      <div class="pill">agentipedia.hubinstitute.com</div>
    </div>
  </div>
</body>
</html>
