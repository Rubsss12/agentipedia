<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Archivo, system-ui, sans-serif; background: #15102e; }
  .slide {
    position: relative; overflow: hidden; color: #fff; display: flex; flex-direction: column;
    background:
      radial-gradient(46rem 30rem at 86% 14%, rgb(230 46 200 / 0.62), transparent 62%),
      radial-gradient(34rem 24rem at 4% 108%, rgb(242 118 79 / 0.5), transparent 58%),
      radial-gradient(50rem 34rem at 55% 120%, rgb(150 43 217 / 0.55), transparent 65%),
      linear-gradient(112deg, #2439e0 0%, #3b2fdd 34%, #6b2bd9 62%, #9a29d5 84%, #c62ecf 100%);
  }
  .slide::before {
    content: ""; position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgb(255 255 255 / 0.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgb(255 255 255 / 0.05) 1px, transparent 1px);
    background-size: 44px 44px;
  }
  .inner { position: relative; height: 100%; display: flex; flex-direction: column; }
  .mid { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .lockup { display: flex; align-items: center; gap: 16px; }
  .lockup img { height: 58px; width: auto; display: block; }
  .lockup span { font-weight: 800; font-size: 26px; letter-spacing: 0.07em; text-transform: uppercase; }
  .kicker { font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: #d6ddff; }
  h1 { font-weight: 800; letter-spacing: -0.025em; line-height: 1.03; }
  em { font-style: normal; color: #e4c9ff; }
  p.body { font-weight: 600; color: rgb(255 255 255 / 0.88); line-height: 1.42; }
  .foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding-top: 26px; border-top: 1px solid rgb(255 255 255 / 0.28); }
  .url { font-weight: 900; letter-spacing: 0.03em; text-transform: uppercase; color: rgb(255 255 255 / 0.92); }
  .pill { background: #fff; color: #1d1160; font-weight: 900; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 999px; }

  /* Bannière de post avec lien, format paysage */
  #annonce { width: 1200px; height: 627px; }
  #annonce .inner { padding: 54px 70px 46px; }
  #annonce h1 { margin-top: 36px; font-size: 76px; max-width: 980px; }
  #annonce p.body { margin-top: 24px; font-size: 25px; max-width: 760px; }
  #annonce .pill { font-size: 20px; padding: 15px 28px; }
  #annonce .url { font-size: 19px; }

  /* Visuel carré */
  #carre { width: 1080px; height: 1080px; }
  #carre .inner { padding: 72px 72px 64px; }
  #carre h1 { margin-top: 48px; font-size: 92px; }
  #carre p.body { margin-top: 36px; font-size: 32px; }
  #carre .pill { font-size: 24px; padding: 18px 34px; }
  #carre .url { font-size: 22px; }
  #carre .kicker { font-size: 22px; }

  /* Carrousel, format portrait 4:5 */
  .c { width: 1080px; height: 1350px; }
  .c .inner { padding: 78px 76px 68px; }
  .c .kicker { font-size: 22px; }
  .c h1 { margin-top: 28px; font-size: 84px; }
  .c h2 { font-weight: 800; font-size: 62px; line-height: 1.08; letter-spacing: -0.02em; margin-top: 36px; }
  .c p.body { margin-top: 32px; font-size: 31px; }
  .c .url { font-size: 21px; }
  .c .pageno { font-weight: 900; font-size: 21px; color: rgb(255 255 255 / 0.6); }

  .rows { margin-top: 54px; display: grid; gap: 18px; }
  .row { display: flex; align-items: center; gap: 24px; background: rgb(255 255 255 / 0.1); border: 1px solid rgb(255 255 255 / 0.22); border-radius: 22px; padding: 26px 30px; }
  .row .n { font-weight: 900; font-size: 56px; line-height: 1; min-width: 190px; }
  .row .l { font-weight: 800; font-size: 30px; }
  .row .d { font-weight: 600; font-size: 22px; color: rgb(255 255 255 / 0.72); margin-top: 4px; }
  .huge { font-weight: 900; font-size: 230px; line-height: 0.88; letter-spacing: -0.04em; margin-top: 24px; }
</style>
</head>

<script>
  const D = JSON.parse(document.getElementById("data").textContent);
  const lang = new URLSearchParams(location.search).get("lang") === "en" ? "en" : "fr";
  document.documentElement.lang = lang;
  for (const el of document.querySelectorAll("[data-k]")) el.textContent = D[el.dataset.k];
  for (const el of document.querySelectorAll("t")) el.textContent = el.dataset[lang];
</script>
